<div class="tabbar"><nav>

  <button data-go="clientes"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5"/><path d="M16 5.5a3 3 0 010 5.6M18 15c2 .7 3 2.3 3 5"/></svg>Clientes</button>
